# Demo broker for the Swarm AMR PoC. Open on the local network, no password.
# For a real site, add a password file or TLS (see docs/field-guide.md).
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
