site_name: Swarm AMR for Human Pickers
site_description: Swarm-style traffic coordination for warehouse pickers, with indoor positioning from real Wi-Fi and a built-in accuracy test.
site_url: https://rmaheedharan.github.io/swarm-amr/
repo_url: https://github.com/rmaheedharan/swarm-amr
repo_name: rmaheedharan/swarm-amr
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  language: en
  icon:
    logo: material/hexagon-multiple-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Concepts:
      - concepts/index.md
      - Problems it solves: concepts/problems.md
      - System architecture: concepts/architecture.md
      - Indoor positioning: concepts/positioning.md
      - Traffic engine: concepts/traffic-engine.md
      - Results and limits: concepts/results.md
  - Implementation:
      - implementation/index.md
      - Shared core library: implementation/core.md
      - Android app: implementation/android.md
      - Mac app (SwarmLocate): implementation/mac.md
      - Backend: implementation/backend.md
  - User guide:
      - guide/index.md
      - Install: guide/install.md
      - Quick start: guide/quickstart.md
      - Field guide: field-guide.md
      - Accuracy test: guide/accuracy-test.md
      - Mac app: guide/mac.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - reference/index.md
      - Site file: site-file.md
      - MQTT protocol: reference/mqtt.md
      - HTTP API: reference/http-api.md
      - Configuration: reference/configuration.md
      - Glossary: reference/glossary.md
  - Contributing:
      - contributing/index.md
      - Development setup: contributing/setup.md
      - Project layout: contributing/layout.md
      - Testing: contributing/testing.md
      - Releases: contributing/releases.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
