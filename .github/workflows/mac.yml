name: Mac

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag, for example mac-v0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          TAG="$RELEASE_INPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          NAME="${TAG#mac-}"; NAME="${NAME#v}"
          if [[ -z "$TAG" ]]; then NAME="0.1.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$NAME" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Newest Xcode
        # The newest Xcode on the runner, so macOS 26 gets the Liquid Glass look. Older Macs still run the app.
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          swift --version

      - name: Tests
        run: swift test

      - name: Build app
        run: ./build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: swarmlocate-mac
          path: mac/dist/*.zip

      - name: GitHub Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: mac/dist/*.zip
          generate_release_notes: true

      - name: Update Homebrew cask
        # A release made from main also moves `brew install --cask swarmlocate` to this version.
        if: steps.ver.outputs.tag != '' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          SHA=$(shasum -a 256 "mac/dist/SwarmLocate-mac-$VERSION.zip" | cut -d' ' -f1)
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/swarmlocate.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew cask: SwarmLocate $VERSION" && git push origin HEAD:main || echo "Cask already up to date"
